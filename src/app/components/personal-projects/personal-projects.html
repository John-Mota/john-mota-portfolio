<section class="section" id="pessoais">
  <div class="container">
    <h2 class="section-title">
      <span class="section-title__label">Labs</span><br>
      Projetos Pessoais
    </h2>
    
    <div class="grid grid--3">
      @for (project of personalProjects(); track project.id) {
        <article class="card personal-card">
          
          <div class="personal-card__header">
            <h3 class="card__title">{{ project.name }}</h3>
            <span *ngIf="project.status" class="status-badge" [class.status-badge--done]="project.status === 'Concluído'">
              {{ project.status }}
            </span>
          </div>

          <p class="card__description">{{ project.description }}</p>
          
          <div class="tags">
            @for (tag of project.tags; track tag) {
              <span class="tag tag--outline">{{ tag }}</span>
            }
          </div>
          
          <footer class="card__footer">
            <div class="links">
              <a *ngIf="project.repo" [href]="project.repo" target="_blank" rel="noopener noreferrer" class="btn btn--ghost" aria-label="Github repository">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-github"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                Repo
              </a>
              <a *ngIf="project.link" [href]="project.link" target="_blank" rel="noopener noreferrer" class="btn btn--sm btn--secondary" aria-label="Live Demo">
                Demo
              </a>
            </div>
          </footer>
        </article>
      }
    </div>
  </div>
</section>

<section class="section" id="projetos">
  <div class="container">
    <h2 class="section-title">
      <span class="section-title__label">Portfólio</span><br>
      Projetos que Participei
    </h2>
    
    <div class="grid grid--3">
      @for (project of projects(); track project.id) {
        <article class="card">
          <img [src]="project.image" [alt]="project.name" class="card__image" loading="lazy">
          
          <h3 class="card__title">{{ project.name }}</h3>
          <p class="card__description">{{ project.description }}</p>
          
          <div class="tags">
            @for (tag of project.tags; track tag) {
              <span class="tag">{{ tag }}</span>
            }
          </div>
          
          <footer class="card__footer">
            <div class="role">
              <strong>Papel:</strong> {{ project.role }}
            </div>
            
            <a *ngIf="project.link" [href]="project.link" target="_blank" rel="noopener noreferrer" class="btn btn--sm btn--primary" aria-label="Ver projeto ao vivo">
              Ver Projeto
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 4px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            </a>
          </footer>
        </article>
      }
    </div>
  </div>
</section>

<section class="section stacks-section" id="stacks">
  <div class="container">
    <h2 class="section-title section-title--center">
      <span class="section-title__label">Skills</span><br>
      Tecnologias e Conhecimentos
    </h2>

    <div class="stacks-container">
      @for (category of categories(); track category.name) {
        <div class="stack-category">
          <h3 class="category-title">{{ category.name }}</h3>
          
          <div class="stack-grid">
            @for (stack of category.items; track stack.name) {
              <div class="stack-item" [attr.aria-label]="stack.name">
                <div class="stack-icon">
                  <img [src]="'https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/' + stack.icon" [alt]="stack.name" onerror="this.src='https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/devicon/devicon-original.svg'">
                </div>

                <div class="stack-tooltip">
                  <strong>{{ stack.name }}</strong>
                  <span class="badge">{{ stack.level }}</span>
                  @if (stack.description) {
                    <span class="desc">{{ stack.description }}</span>
                  }
                </div>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
